            padding: 0;

        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            padding: 40px 20px 30px;
            text-align: center;
            border-bottom: 2px solid #636EFA;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        .header p {
            font-size: 1rem;
            color: #8892b0;
            max-width: 600px;
            margin: 0 auto;
        }
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
            padding: 30px 20px 60px;
        }
        .chart-card {
            background: #1a1a2e;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border: 1px solid #2a2a3e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: box-shadow 0.3s ease;
        }
        .chart-card:hover {
            box-shadow: 0 6px 30px rgba(99, 110, 250, 0.15);
        }
        .footer {
            text-align: center;
            padding: 30px 20px;
            color: #555;
            font-size: 0.85rem;
            border-top: 1px solid #2a2a3e;
        }
        .footer a { color: #636EFA; text-decoration: none; }
        .footer a:hover { text-decoration: underline; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 20px;
            flex-wrap: wrap;
        }
        .stat {
            text-align: center;
        }
        .stat .number {
            font-size: 1.8rem;
            font-weight: 700;
            color: #636EFA;
        }
        .stat .label {
            font-size: 0.8rem;
            color: #8892b0;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 4px;
        }
    </style>
